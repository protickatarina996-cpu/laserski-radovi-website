<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Laserski Radovi &mdash; Precizno lasersko sečenje</title>
  <meta name="description" content="Lasersko sečenje i graviranje za tekstil, brending i personalizaciju. Čisti rezovi, oštri detalji.">
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" fill="%230b0b0d"/><circle cx="16" cy="16" r="4" fill="%23ffd58c"/><circle cx="16" cy="16" r="1.6" fill="%23fff"/></svg>'>
  <link rel="preload" as="image" href="homepage.png" fetchpriority="high">
  <link rel="stylesheet" href="assets/css/hero.css">
</head>
<body>

  <!-- The hero photograph is the asset itself, unmodified. The animation is
       appended into .hero__stage by the script, in the same coordinate box. -->
  <header class="hero" data-laser-hero>
    <div class="hero__stage" data-laser-stage>
      <img class="hero__image"
           src="homepage.png"
           width="1983" height="793"
           fetchpriority="high" decoding="async"
           alt="Laserski Radovi — laserska glava seče natpis LASERSKI u tamnom materijalu.">
    </div>
  </header>

  <main>
    <section class="section">
      <h2>Usluge</h2>
      <p>Lasersko sečenje i graviranje za tekstil, kožu, drvo i akril. Radimo pojedinačne
         komade i serijsku proizvodnju, sa istom preciznošću u oba slučaja.</p>
      <p>Pošaljite nam vektorski fajl ili ideju — ostalo je na nama.</p>
    </section>

    <section class="section section--tall">
      <h2>Galerija</h2>
      <p>Presek radova iz proizvodnje.</p>
    </section>
  </main>

  <script src="assets/js/laser-cut-program.js"></script>
  <script src="assets/js/laser-cutting-animation.js" defer></script>
</body>
</html>
